<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rivami</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--surf:#fff;--surf2:#eef1f8;--bd:rgba(20,30,60,.1);--tx:#121a30;--mu:#6b7490;--ac:#0fb67a;--acs:rgba(15,182,122,.12);--vi:#6355f5;--vis:rgba(99,85,245,.12);--rd:#ec4b5a;--rds:rgba(236,75,90,.12);--am:#e99a14;--ams:rgba(233,154,20,.14);--land:#e9edf5;--water:#cfe0f5;--park:#cdeedd;--road:#fff;--sh:0 8px 30px rgba(20,30,60,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080c16;--surf:#10162a;--surf2:#18203a;--bd:rgba(255,255,255,.08);--tx:#eaedf7;--mu:#8089a6;--ac:#3bffb2;--acs:rgba(59,255,178,.12);--vi:#8a7fff;--vis:rgba(138,127,255,.14);--rd:#ff5f6d;--rds:rgba(255,95,109,.14);--am:#ffb547;--ams:rgba(255,181,71,.14);--land:#0d1324;--water:#0f2442;--park:#0f2a2a;--road:#1b2440;--sh:0 8px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#080c16;--surf:#10162a;--surf2:#18203a;--bd:rgba(255,255,255,.08);--tx:#eaedf7;--mu:#8089a6;--ac:#3bffb2;--acs:rgba(59,255,178,.12);--vi:#8a7fff;--vis:rgba(138,127,255,.14);--rd:#ff5f6d;--rds:rgba(255,95,109,.14);--am:#ffb547;--ams:rgba(255,181,71,.14);--land:#0d1324;--water:#0f2442;--park:#0f2a2a;--road:#1b2440;--sh:0 8px 30px rgba(0,0,0,.4)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;background-image:radial-gradient(900px 400px at 85% -10%,var(--vis),transparent),radial-gradient(700px 400px at -5% 0%,var(--acs),transparent);background-attachment:fixed}
h1,h2,h3,.sora{font-family:Sora,sans-serif;letter-spacing:-.02em}
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem 1.5rem;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.logo{display:flex;align-items:center;gap:.6rem;font-family:Sora;font-weight:700;font-size:1.1rem}
.logo i{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--vi));display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700;font-size:1rem;box-shadow:0 4px 14px var(--acs)}
.tabs{display:flex;gap:4px;background:var(--surf);border:1px solid var(--bd);padding:4px;border-radius:12px}
.tabs button{border:0;background:none;color:var(--mu);font:500 .85rem Inter;padding:.45rem 1.1rem;border-radius:9px;cursor:pointer;transition:.2s}
.tabs button.on{background:var(--tx);color:var(--bg)}
.btn{border:1px solid var(--bd);background:var(--surf);color:var(--tx);font:600 .82rem Inter;padding:.55rem 1rem;border-radius:10px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.btn.p{background:linear-gradient(135deg,var(--ac),#10c9d6);color:#04281c;border:0}
.btn.sm{padding:.3rem .7rem;font-size:.75rem}
.btn:disabled{opacity:.4;pointer-events:none}
.hr{display:flex;gap:.5rem}
main{padding:1.25rem 1.5rem;max-width:1400px;margin:0 auto}
section{display:none}section.on{display:block}
.map-wrap{display:grid;grid-template-columns:1fr 380px;gap:1rem;height:calc(100vh - 110px);min-height:520px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh)}
.mapbox{position:relative;overflow:hidden}
#map{width:100%;height:100%;display:block;background:var(--land);cursor:grab}
.pin{cursor:pointer;transition:transform .2s}
.pin:hover .pb{transform:scale(1.12)}
.pb{transform-box:fill-box;transform-origin:center bottom;transition:.2s}
.pin.sel .pb{transform:scale(1.3)}
.pulse{animation:pl 2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%{opacity:.6;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
.chip{position:absolute;left:16px;top:16px;display:flex;gap:8px;flex-wrap:wrap}
.chip span{background:var(--surf);border:1px solid var(--bd);border-radius:99px;padding:.35rem .8rem;font-size:.75rem;font-weight:600;box-shadow:var(--sh);display:flex;align-items:center;gap:6px}
.chip b{width:8px;height:8px;border-radius:50%}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:11px;border:1px solid var(--bd);background:var(--surf);color:var(--tx);font-size:1.2rem;cursor:pointer;box-shadow:var(--sh)}
.tip{position:absolute;pointer-events:none;background:var(--tx);color:var(--bg);padding:.4rem .7rem;border-radius:9px;font-size:.75rem;font-weight:600;opacity:0;transition:.15s;white-space:nowrap;transform:translate(-50%,-130%)}
.side{display:flex;flex-direction:column;overflow:hidden}
.sh{padding:1.1rem 1.2rem .8rem}
.sh h2{font-size:1.1rem}.sh p{color:var(--mu);font-size:.8rem}
.search{width:100%;margin-top:.7rem;background:var(--surf2);border:1px solid transparent;border-radius:11px;padding:.6rem .9rem;color:var(--tx);font:inherit;outline:0}
.search:focus,.in:focus{border-color:var(--ac)}
.list{overflow:auto;flex:1;padding:0 .7rem .7rem}
.lot{padding:.85rem;border-radius:14px;cursor:pointer;border:1px solid transparent;margin-bottom:4px;transition:.15s}
.lot:hover{background:var(--surf2)}.lot.sel{background:var(--surf2);border-color:var(--ac)}
.lot .t{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.lot .a{color:var(--mu);font-size:.75rem;margin-bottom:.55rem}
.bar{height:6px;border-radius:9px;background:var(--surf2);overflow:hidden}
.lot.sel .bar{background:var(--bg)}
.bar i{display:block;height:100%;border-radius:9px}
.pill{font-size:.7rem;font-weight:700;padding:.2rem .6rem;border-radius:99px}
.g{background:var(--acs);color:var(--ac)}.y{background:var(--ams);color:var(--am)}.r{background:var(--rds);color:var(--rd)}.v{background:var(--vis);color:var(--vi)}
.det{display:none;flex-direction:column;height:100%}.det.on{display:flex}
.db{overflow:auto;padding:0 1.2rem;flex:1}
.back{background:none;border:0;color:var(--mu);cursor:pointer;font:600 .8rem Inter;padding:1.1rem 1.2rem .3rem;text-align:left}
.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:.9rem 0}
.k3 div{background:var(--surf2);border-radius:13px;padding:.7rem;text-align:center}
.k3 b{font:700 1.45rem Sora;display:block;line-height:1.1}.k3 small{color:var(--mu);font-size:.7rem}
.lb{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);font-weight:700;margin:1rem 0 .5rem}
.fc{display:flex;align-items:flex-end;gap:6px;height:64px}
.fc div{flex:1;border-radius:7px 7px 3px 3px;position:relative;min-height:6px}
.fc small{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:.65rem;color:var(--mu)}
.vg{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:1.6rem}
.v1{aspect-ratio:1;border-radius:7px;font-size:.6rem;font-weight:700;display:grid;place-items:center;cursor:default}
.v1.f{background:var(--acs);color:var(--ac);cursor:pointer;border:1px solid transparent}.v1.f:hover{border-color:var(--ac)}.v1.f.pk{background:var(--ac);color:#04281c}
.v1.o{background:var(--rds);color:var(--rd)}.v1.e{background:var(--vis);color:var(--vi)}
.df{padding:1rem 1.2rem;border-top:1px solid var(--bd)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:1.25rem}
.st{padding:1.2rem;position:relative;overflow:hidden}
.st::after{content:"";position:absolute;right:-20px;top:-20px;width:80px;height:80px;border-radius:50%;background:var(--c);opacity:.14}
.st small{color:var(--mu);font-weight:600;font-size:.75rem}.st b{display:block;font:700 2rem Sora;color:var(--c);line-height:1.2}
.bar2{display:flex;gap:.7rem;margin-bottom:1rem;flex-wrap:wrap}
.in{background:var(--surf);border:1px solid var(--bd);border-radius:11px;padding:.6rem .9rem;color:var(--tx);font:inherit;outline:0}
.bar2 .in:first-child{flex:1;min-width:200px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);padding:.9rem 1.2rem;border-bottom:1px solid var(--bd)}
td{padding:.9rem 1.2rem;border-bottom:1px solid var(--bd)}tr:last-child td{border:0}
tbody tr:hover{background:var(--surf2)}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--vis);color:var(--vi);font-weight:700;font-size:.75rem;margin-right:.6rem;vertical-align:middle}
.plate{font:600 .8rem ui-monospace,monospace;border:1.5px solid var(--bd);border-radius:6px;padding:.15rem .5rem;background:var(--surf2);letter-spacing:.06em}
.ov{position:fixed;inset:0;background:rgba(5,8,20,.6);backdrop-filter:blur(6px);display:none;place-items:center;z-index:100}.ov.on{display:grid}
.modal{width:420px;max-width:92vw;padding:1.6rem;animation:up .25s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.modal h3{margin-bottom:1rem;font-size:1.15rem}
.fg{margin-bottom:.8rem}.fg label{display:block;font-size:.72rem;color:var(--mu);font-weight:600;margin-bottom:.3rem}.fg .in{width:100%;background:var(--surf2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,90px);background:var(--tx);color:var(--bg);padding:.7rem 1.2rem;border-radius:12px;font-weight:600;transition:.3s;z-index:200}.toast.on{transform:translate(-50%,0)}
@media(max-width:900px){.map-wrap{grid-template-columns:1fr;height:auto}.mapbox{height:50vh}.side{max-height:70vh}.stats{grid-template-columns:1fr 1fr}.card.tb{overflow-x:auto}header{padding:.6rem 1rem}.logo span{display:none}main{padding:1rem}}
</style>
</head>
<body>
<header>
  <div class="logo"><i>R</i><span>Rivami</span></div>
  <div class="tabs"><button class="on" data-t="mapa">Mapa</button><button data-t="res">Reservas</button></div>
  <div class="hr"><button class="btn" id="th" title="Tema">◐</button><button class="btn p" onclick="openM()">+ Reservar</button></div>
</header>
<main>
<section id="mapa" class="on"><div class="map-wrap">
  <div class="card mapbox">
    <svg id="map" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="chip"><span><b style="background:var(--ac)"></b>Livre</span><span><b style="background:var(--am)"></b>Quase cheio</span><span><b style="background:var(--rd)"></b>Lotado</span></div>
    <div class="zoom"><button onclick="zm(1.3)">+</button><button onclick="zm(.77)">−</button></div>
    <div class="tip" id="tip"></div>
  </div>
  <div class="card side">
    <div id="vl" style="display:flex;flex-direction:column;height:100%;min-height:0">
      <div class="sh"><h2>Estacionamentos</h2><p><b id="tl" style="color:var(--ac)"></b> vagas livres agora em São Paulo</p><input class="search" id="q" placeholder="Buscar estacionamento ou rua…"></div>
      <div class="list" id="list"></div>
    </div>
    <div class="det" id="vd">
      <button class="back" onclick="back()">← Todos os estacionamentos</button>
      <div class="db">
        <h2 id="dn"></h2><p id="da" style="color:var(--mu);font-size:.8rem"></p>
        <div class="k3" id="k3"></div>
        <div class="lb">Previsão da IA</div><div class="fc" id="fc"></div>
        <div class="lb" style="margin-top:1.8rem">Vagas · toque numa livre para reservar</div><div class="vg" id="vg"></div>
      </div>
      <div class="df"><button class="btn p" id="rb" style="width:100%" onclick="openM()">Reservar neste estacionamento</button></div>
    </div>
  </div>
</div></section>

<section id="res">
  <div style="margin-bottom:1.25rem"><h1 style="font-size:1.6rem">Reservas</h1><p style="color:var(--mu)">Acompanhe e gerencie as reservas de hoje.</p></div>
  <div class="stats" id="stats"></div>
  <div class="bar2"><input class="in" id="b" placeholder="Buscar por placa, nome ou vaga…"><select class="in" id="fs"><option value="">Todos os status</option><option>ativa</option><option>pendente</option><option>encerrada</option></select></div>
  <div class="card tb"><table><thead><tr><th>Motorista</th><th>Placa</th><th>Local</th><th>Vaga</th><th>Horário</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</section>
</main>

<div class="ov" id="ov"><div class="card modal">
  <h3>Nova reserva</h3>
  <div class="fg"><label>Estacionamento</label><select class="in" id="me"></select></div>
  <div class="g2"><div class="fg"><label>Vaga</label><select class="in" id="mv"></select></div><div class="fg"><label>Placa</label><input class="in" id="mp" placeholder="ABC-1D23" maxlength="8"></div></div>
  <div class="fg"><label>Nome do motorista</label><input class="in" id="mn" placeholder="Nome completo"></div>
  <div class="g2"><div class="fg"><label>Entrada</label><input class="in" type="time" id="m1" value="09:00"></div><div class="fg"><label>Saída</label><input class="in" type="time" id="m2" value="11:00"></div></div>
  <div style="display:flex;gap:.6rem;justify-content:flex-end;margin-top:.6rem"><button class="btn" onclick="closeM()">Cancelar</button><button class="btn p" onclick="ok()">Confirmar reserva</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const L=[
{id:1,n:'Estac. Sé Centro',a:'Praça da Sé, 111',x:560,y:430,t:40,o:28,r:4},
{id:2,n:'Park Paulista',a:'Av. Paulista, 900',x:470,y:340,t:60,o:32,r:6},
{id:3,n:'Consolação Park',a:'R. da Consolação, 400',x:400,y:290,t:30,o:19,r:8},
{id:4,n:'Estac. Liberdade',a:'R. Galvão Bueno, 200',x:600,y:500,t:25,o:8,r:2},
{id:5,n:'República Garage',a:'Praça da República, 50',x:490,y:240,t:50,o:38,r:12},
{id:6,n:'Vila Madalena',a:'R. Aspicuelta, 55',x:230,y:230,t:35,o:14,r:3},
{id:7,n:'Faria Lima Park',a:'Av. Faria Lima, 1500',x:250,y:430,t:80,o:34,r:15},
{id:8,n:'Itaim Garage',a:'R. Leopoldo Couto, 300',x:330,y:540,t:45,o:31,r:9}];
const R=[
{id:1,l:1,v:'A-07',p:'ABC-1D23',m:'Carlos Mendes',a:'08:00',b:'10:00',s:'ativa'},
{id:2,l:2,v:'A-12',p:'XYZ-5E78',m:'Ana Souza',a:'09:30',b:'11:30',s:'ativa'},
{id:3,l:1,v:'A-03',p:'DEF-9A12',m:'Paulo Lima',a:'07:00',b:'09:00',s:'encerrada'},
{id:4,l:3,v:'A-28',p:'GHI-3B56',m:'Maria Costa',a:'10:00',b:'12:00',s:'pendente'},
{id:5,l:7,v:'A-50',p:'JKL-7C90',m:'João Silva',a:'10:30',b:'13:00',s:'ativa'},
{id:6,l:2,v:'A-45',p:'MNO-2D45',m:'Fernanda Alves',a:'11:00',b:'14:00',s:'pendente'}];
const $=s=>document.getElementById(s),free=l=>l.t-l.o-l.r,pct=l=>Math.round((l.o+l.r)/l.t*100);
const col=l=>free(l)===0?'var(--rd)':pct(l)>75?'var(--am)':'var(--ac)';
const pc=l=>free(l)===0?'r':pct(l)>75?'y':'g';
let sel=null,vb=[0,0,1000,640],pick=null;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==b.dataset.t))});
$('th').onclick=()=>{const d=document.documentElement,dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dark?'light':'dark'};

/* MAPA SVG */
function drawMap(){
 const roads=[['M0 300 C250 290 500 360 1000 330',9],['M470 0 L520 640',9],['M0 520 C300 480 600 560 1000 480',7],['M150 0 C200 250 260 450 330 640',7],['M380 250 L650 520',6],['M700 0 C690 200 740 400 760 640',6],['M0 160 L1000 200',4],['M0 600 L1000 560',4],['M300 0 L360 640',3],['M850 0 L880 640',3],['M0 420 L1000 400',3]];
 let s=`<defs><filter id="sd"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity=".35"/></filter></defs><rect width="1000" height="640" fill="var(--land)"/>
 <path d="M0 90 C200 60 300 150 520 120 S850 40 1000 90 L1000 0 L0 0Z" fill="var(--water)"/>
 <ellipse cx="640" cy="330" rx="70" ry="42" fill="var(--park)"/><ellipse cx="130" cy="330" rx="60" ry="46" fill="var(--park)"/><ellipse cx="780" cy="520" rx="90" ry="50" fill="var(--park)"/><ellipse cx="400" cy="440" rx="40" ry="28" fill="var(--park)"/>`;
 roads.forEach(r=>s+=`<path d="${r[0]}" stroke="var(--road)" stroke-width="${r[1]}" fill="none" stroke-linecap="round"/>`);
 s+=`<g font-size="11" font-weight="600" fill="var(--mu)" font-family="Inter" opacity=".8"><text x="700" y="336">Av. Paulista</text><text x="40" y="500">Av. Faria Lima</text><text x="780" y="70">Rio Tietê</text><text x="590" y="320">Parque</text></g><g id="pins">`;
 L.forEach(l=>{const c=col(l);s+=`<g class="pin" data-id="${l.id}" transform="translate(${l.x} ${l.y})"><circle class="pulse" r="16" fill="${c}"/><g class="pb" filter="url(#sd)"><path d="M0 0C-17-18-22-30-22-40a22 22 0 0 1 44 0c0 10-5 22-22 40Z" fill="${c}"/><circle cy="-40" r="14" fill="var(--surf)"/><text y="-35" text-anchor="middle" font-size="14" font-weight="700" font-family="Sora" fill="var(--tx)">${free(l)}</text></g></g>`});
 $('map').innerHTML=s+'</g>';
 document.querySelectorAll('.pin').forEach(p=>{const l=L.find(x=>x.id==p.dataset.id);p.onclick=()=>pickLot(l.id);
  p.onmousemove=e=>{const b=$('map').parentNode.getBoundingClientRect(),t=$('tip');t.style.left=e.clientX-b.left+'px';t.style.top=e.clientY-b.top+'px';t.textContent=l.n+' · '+free(l)+' livres';t.style.opacity=1};p.onmouseleave=()=>$('tip').style.opacity=0});
}
function setVB(){$('map').setAttribute('viewBox',vb.join(' '))}
function zm(f){const[cx,cy]=[vb[0]+vb[2]/2,vb[1]+vb[3]/2],w=Math.min(1000,Math.max(250,vb[2]/f)),h=w*.64;vb=[Math.max(0,Math.min(1000-w,cx-w/2)),Math.max(0,Math.min(640-h,cy-h/2)),w,h];setVB()}

/* LISTA / DETALHE */
function renderList(){
 const q=$('q').value.toLowerCase();let tot=0;L.forEach(l=>tot+=free(l));$('tl').textContent=tot;
 $('list').innerHTML=L.filter(l=>(l.n+l.a).toLowerCase().includes(q)).map(l=>`<div class="lot ${sel==l.id?'sel':''}" onclick="pickLot(${l.id})"><div class="t">${l.n}<span class="pill ${pc(l)}">${free(l)===0?'Lotado':free(l)+' vagas'}</span></div><div class="a">${l.a}</div><div class="bar"><i style="width:${pct(l)}%;background:${col(l)}"></i></div></div>`).join('')||'<p style="padding:1rem;color:var(--mu)">Nenhum resultado.</p>';
}
function pickLot(id){
 sel=id;pick=null;const l=L.find(x=>x.id==id);
 $('vl').style.display='none';$('vd').classList.add('on');
 $('dn').textContent=l.n;$('da').textContent=l.a;
 $('k3').innerHTML=`<div><b style="color:var(--ac)">${free(l)}</b><small>livres</small></div><div><b style="color:var(--vi)">${l.r}</b><small>reservadas</small></div><div><b style="color:var(--rd)">${l.o}</b><small>ocupadas</small></div>`;
 const p=pct(l),f=[['Agora',p],['+1h',Math.min(99,p+9)],['+2h',Math.min(99,p+19)],['+3h',Math.min(99,p+6)]];
 $('fc').innerHTML=f.map(([a,v])=>`<div style="height:${v}%;background:${v>85?'var(--rd)':v>70?'var(--am)':'var(--ac)'}"><small>${a}</small></div>`).join('');
 let g='';for(let i=1;i<=Math.min(l.t,40);i++){const c=i<=l.o?'o':i<=l.o+l.r?'e':'f';g+=`<div class="v1 ${c}" ${c=='f'?`onclick="pickV(this,'A-${String(i).padStart(2,'0')}')"`:''}>${String(i).padStart(2,'0')}</div>`}
 $('vg').innerHTML=g;$('rb').disabled=free(l)===0;
 document.querySelectorAll('.pin').forEach(x=>x.classList.toggle('sel',x.dataset.id==id));
 const w=360,h=w*.64;vb=[Math.max(0,Math.min(1000-w,l.x-w/2)),Math.max(0,Math.min(640-h,l.y-h/2-20)),w,h];setVB();
}
function pickV(el,v){document.querySelectorAll('.v1.pk').forEach(x=>x.classList.remove('pk'));el.classList.add('pk');pick=v;openM()}
function back(){sel=null;$('vl').style.display='flex';$('vd').classList.remove('on');document.querySelectorAll('.pin').forEach(x=>x.classList.remove('sel'));vb=[0,0,1000,640];setVB();renderList()}
$('q').oninput=renderList;

/* RESERVAS */
function renderRes(){
 const c=s=>R.filter(r=>r.s==s).length;
 $('stats').innerHTML=[['Ativas',c('ativa'),'--ac'],['Pendentes',c('pendente'),'--am'],['Encerradas',c('encerrada'),'--rd'],['Total hoje',R.length,'--vi']].map(([a,b,k])=>`<div class="card st" style="--c:var(${k})"><small>${a}</small><b>${b}</b></div>`).join('');
 const q=$('b').value.toLowerCase(),f=$('fs').value;
 const d=R.filter(r=>(r.m+r.p+r.v).toLowerCase().includes(q)&&(!f||r.s==f));
 const cl={ativa:'g',pendente:'y',encerrada:'r'};
 $('tb').innerHTML=d.map(r=>`<tr><td><span class="av">${r.m.split(' ').map(w=>w[0]).slice(0,2).join('')}</span>${r.m}</td><td><span class="plate">${r.p}</span></td><td>${L.find(l=>l.id==r.l).n}</td><td><b>${r.v}</b></td><td style="color:var(--mu)">${r.a} – ${r.b}</td><td><span class="pill ${cl[r.s]}">${r.s}</span></td><td><button class="btn sm" ${r.s=='encerrada'?'disabled':''} onclick="end(${r.id})">Encerrar</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--mu);padding:2rem">Nenhuma reserva encontrada.</td></tr>';
}
$('b').oninput=renderRes;$('fs').onchange=renderRes;
function end(id){const r=R.find(x=>x.id==id);r.s='encerrada';renderRes();toast('Reserva encerrada')}

/* MODAL */
function vagas(){const l=L.find(x=>x.id==$('me').value),a=[];for(let i=l.o+l.r+1;i<=l.t;i++)a.push('A-'+String(i).padStart(2,'0'));$('mv').innerHTML=a.map(v=>`<option>${v}</option>`).join('')||'<option>Sem vagas</option>'}
function openM(){$('me').innerHTML=L.filter(l=>free(l)>0).map(l=>`<option value="${l.id}">${l.n} (${free(l)} livres)</option>`).join('');if(sel&&free(L.find(l=>l.id==sel))>0)$('me').value=sel;vagas();if(pick)$('mv').value=pick;$('ov').classList.add('on')}
function closeM(){$('ov').classList.remove('on')}
$('me').onchange=vagas;$('ov').onclick=e=>{if(e.target==$('ov'))closeM()};
function ok(){
 const p=$('mp').value.trim().toUpperCase(),m=$('mn').value.trim();
 if(!p||!m)return toast('Preencha placa e nome');
 const l=L.find(x=>x.id==$('me').value);if(free(l)<1)return toast('Sem vagas disponíveis');
 R.unshift({id:Date.now(),l:l.id,v:$('mv').value,p,m,a:$('m1').value,b:$('m2').value,s:'pendente'});l.r++;
 $('mp').value='';$('mn').value='';pick=null;closeM();toast('Reserva confirmada!');
 drawMap();renderList();renderRes();if(sel)pickLot(sel);
}
drawMap();renderList();renderRes();
</script>
</body>
</html>
